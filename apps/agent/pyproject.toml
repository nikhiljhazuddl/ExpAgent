[project]
name = "gtm-mesh-agent"
version = "0.1.0"
description = "GTM Mesh Expansion Agent V1 (LangGraph + Anthropic)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.54.0",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.0",
    "pydantic>=2.9.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.0.1",
    "tenacity>=9.0.0",
    "typer>=0.15.1",
    "rich>=13.9.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "schemas", "prompts", "config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
